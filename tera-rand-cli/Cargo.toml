[package]
name = "tera-rand-cli"
version = "0.2.2"
authors = ["Raymond Liu <philosobyte@gmail.com>"]
categories = ["template-engine", "command-line-utilities"]
description = "A CLI tool for generating a feed of random data from a Tera template"
edition = "2021"
keywords = ["fake",]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Philosobyte/tera-rand"
rust-version = "1.72"

[dependencies]
anyhow = "1.0"
clap = { version = "=4.5", features = ["derive"] }
chrono = "0.4"
iso8601 = "0.6"
tera = "1.20"
tera-rand = { version = "0.2", path = "../tera-rand" }
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.1"
regex = "1.12"
tracing = "0.1"
tracing-test = "0.2"
